name: Release PR
on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Choose release type
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      beta:
        type: boolean
        description: Prerelease
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  releaseIt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          cache: true
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE_ARG: ${{ fromJSON('{"auto":"", "patch":"patch", "minor":"minor", "major":"major"}')[github.event.inputs.type] }}
          BETA_ARG: ${{ github.event.inputs.beta == 'true' && '--preRelease=beta' || '' }}
        run: pnpm run release $TYPE_ARG --ci --verbose --no-git --no-github $BETA_ARG
      - name: Show git status
        if: failure()
        run: git status && git diff
      - name: Add contributors list to CHANGELOG.md
        run: pnpm run release:changelog:fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3
      - name: Run size-limit
        run: pnpm run size
      - name: Generate PR body
        id: body
        uses: mathiasvr/command-output@v1
        with:
          run: node ./bin/format-size-report.js
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          branch: release/v${{ steps.package-version.outputs.current-version}}
          delete-branch: true
          commit-message: "chore: release v${{ steps.package-version.outputs.current-version}}"
          title: "chore: release v${{ steps.package-version.outputs.current-version}}"
          body: |
            ${{ steps.body.outputs.stdout }}
            ## Release notes:
            ${{ steps.extract-release-notes.outputs.release_notes || 'No release notes available.' }}
          labels: |
            release
            bot
          signoff: false
          draft: false
      - name: Show PR link
        if: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "LS Service Release v${{ steps.package-version.outputs.current-version}}' pull request - ${{ steps.cpr.outputs.pull-request-url }}"
